name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hansardlens
          POSTGRES_USER: hansardlens
          POSTGRES_PASSWORD: hansardlens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hansardlens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only
      POSTGRES_DB: hansardlens
      POSTGRES_USER: hansardlens
      POSTGRES_PASSWORD: hansardlens
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest -q
