# Production stack: gunicorn, DEBUG off, hashed static files, no source mount.
#
# It listens only on the server's loopback (127.0.0.1:${HANSARD_PORT:-8010}); the reverse
# proxy already on the server publishes it, e.g. at /hansardlens/.
# The fixed project name keeps its containers, network and volume separate from any
# other app on the same host. See deploy/DEPLOY.md.
#
#   docker compose -f docker-compose.prod.yml up -d --build
name: hansardlens

# Container logs are capped (3 files x 10 MB per service) so they cannot fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    # Same major version as development (16); the Alpine image is smaller.
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hansardlens}
      POSTGRES_USER: ${POSTGRES_USER:-hansardlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment: &prod-env
      DJANGO_DEBUG: "0"
      DJANGO_PRODUCTION: "1"
      DJANGO_STATIC_MANIFEST: "1"
      HANSARD_CACHE: file
      POSTGRES_HOST: db
    ports:
      - "${HANSARD_BIND:-127.0.0.1}:${HANSARD_PORT:-8010}:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi --bind 0.0.0.0:8000 --workers $${GUNICORN_WORKERS:-2}
             --timeout 60 --access-logfile -"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Downloads new sittings and updates the analysis on a timetable.
  # Logs: docker compose -f docker-compose.prod.yml logs -f scheduler
  scheduler:
    build: .
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment: *prod-env
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    command: python manage.py run_scheduler --at 06:30 --days tue,wed,thu,fri,sat

  # Nightly database dumps into ./data/backups (newest BACKUP_KEEP kept); see deploy/backup.sh.
  # Same PostgreSQL version as the database, so pg_dump always matches the server.
  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *logging
    user: "1000:1000"
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-hansardlens}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-hansardlens}
      TZ: America/Toronto
      BACKUP_DIR: /backups
      BACKUP_AT: ${BACKUP_AT:-02:30}
      BACKUP_KEEP: ${BACKUP_KEEP:-3}
      BACKUP_HEALTHCHECK_URL: ${BACKUP_HEALTHCHECK_URL:-}
    volumes:
      - ./data/backups:/backups
      - ./deploy/backup.sh:/usr/local/bin/backup.sh:ro
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]

volumes:
  pgdata_prod:
