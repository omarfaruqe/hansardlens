services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hansardlens}
      POSTGRES_USER: ${POSTGRES_USER:-hansardlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hansardlens}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"

  # Downloads new sittings and updates the analysis on a timetable.
  # Logs: docker compose logs -f scheduler
  scheduler:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: python manage.py run_scheduler --at 06:30 --days tue,wed,thu,fri,sat

volumes:
  pgdata:
