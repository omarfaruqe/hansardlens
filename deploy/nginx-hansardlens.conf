# HansardLens at http://<server>/maplemetrics/hansardlens/
#
# Paste these two blocks INSIDE the existing `server { ... }` block that already serves
# /maplemetrics/. Nothing else in that block needs to change:
#  - nginx picks the longest matching prefix, so /maplemetrics/hansardlens/ goes here
#    and every other /maplemetrics/ address still goes to MapleMetrics;
#  - "^~" stops any regular-expression location in the same block from taking over.
#
# The trailing slash on proxy_pass strips the prefix before forwarding; HansardLens
# adds it back to its links (DJANGO_SCRIPT_NAME in .env).

location = /maplemetrics/hansardlens {
    return 301 /maplemetrics/hansardlens/;
}

location ^~ /maplemetrics/hansardlens/ {
    proxy_pass http://127.0.0.1:8010/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    client_max_body_size 2m;
}
