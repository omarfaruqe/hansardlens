# HansardLens at http://<server>/hansardlens/ (for servers whose gateway is nginx;
# this project's server uses Caddy, see Caddyfile.example).
#
# Paste these two blocks inside the existing `server { ... }` block. "^~" stops any
# regular-expression location in the same block from taking over.
#
# The trailing slash on proxy_pass strips the prefix before forwarding; HansardLens
# adds it back to its links (DJANGO_SCRIPT_NAME in .env).

location = /hansardlens {
    return 301 /hansardlens/;
}

location ^~ /hansardlens/ {
    proxy_pass http://127.0.0.1:8010/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    client_max_body_size 2m;
}
